[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assassinate"
version = "0.1.0"
description = "A modular, themed exploitation framework with payload (bullet) generation."
authors = [
    { name = "Austin Stark", email = "austin.stark@blacklanternsecurity.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["exploitation", "pentest", "payload", "framework", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

dependencies = [
    "ansible-core>=2.15.0",
    "ansible-runner>=2.3.0",
    "ansible>=9.0.0",  # Includes community.general for Alpine APK support
    "msgpack>=1.0.0",
    "packaging>=21.0",
    "setuptools>=80.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
assassinate-setup = "setup.cli:main"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = ["python/assassinate", "python/setup"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --color=yes -ra"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require daemon)",
    "slow: Slow tests",
    "exploit: Tests that involve exploits",
    "auxiliary: Tests that involve auxiliary modules",
    "asyncio: Async tests using pytest-asyncio",
]
asyncio_mode = "auto"
minversion = "3.10"
