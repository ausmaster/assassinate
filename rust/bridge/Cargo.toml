[package]
name = "bridge"
version = "0.1.0"
edition = "2021"
authors = ["Austin Stark <austin.stark@blacklanternsecurity.com>"]
description = "Rust FFI bridge to Metasploit Framework via Magnus (Ruby embedding)"
license = "GPL-3.0"

[lib]
name = "msf"
# rlib: Rust library (for use as dependency)
# cdylib: C-compatible dynamic library (for Python extension via maturin)
crate-type = ["rlib", "cdylib"]

[features]
default = []
pyo3 = ["dep:pyo3"]

[dependencies]
# Magnus for Ruby FFI with embed feature for proper VM initialization
magnus = { version = "0.8", features = ["embed", "rb-sys"] }
rb-sys = "0.9"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
hex = "0.4"
base64 = "0.22"
serde_magnus = "0.10.0"

# Optional Python bindings
pyo3 = { version = "0.21", features = ["extension-module", "multiple-pymethods"], optional = true }

[dev-dependencies]
ntest = "0.9.5"
# No external test frameworks needed - using Magnus pattern (one test per file)

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
